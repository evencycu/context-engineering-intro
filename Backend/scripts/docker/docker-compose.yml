version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: teamsnotify-postgres
    environment:
      POSTGRES_DB: notification_center
      POSTGRES_USER: teamsnotify
      POSTGRES_PASSWORD: teamsnotify123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./internal/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./internal/database/init.sql:/docker-entrypoint-initdb.d/02-init.sql
    networks:
      - teamsnotify-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamsnotify -d notification_center"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: teamsnotify-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - teamsnotify-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  apiserver:
    image: teamsnotify-api-server
    container_name: teamsnotify-api-server
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=debug
      - PORT=8080
      - DATABASE_URL=postgresql://teamsnotify:teamsnotify123@postgres:5432/notification_center?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - TEAMS_BOT_APP_ID=local-test-app-id
      - TEAMS_TENANT_ID=local-test-tenant-id
      - TEAMS_BOT_APP_PASSWORD=local-test-app-password
      - JWT_SECRET=supersecretjwtkey
      - LOG_LEVEL=debug
    networks:
      - teamsnotify-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  teamsnotify-network:
    driver: bridge
