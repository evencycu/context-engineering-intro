apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: teams-notification-prod

resources:
  - namespace.yaml
  - secrets.yaml
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - apiserver.yaml
  # removed worker/admin

commonLabels:
  app: teams-notification
  environment: prod
  tier: production

images:
  - name: teams-notification/api-server
    newTag: prod-latest
  # removed worker/admin images

patchesStrategicMerge:
  - |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: teams-notification-api-server
    spec:
      template:
        spec:
          containers:
          - name: api-server
            env:
            - name: DEBUG_MODE
              value: "false"
            - name: MOCK_EXTERNAL_APIS
              value: "false"
