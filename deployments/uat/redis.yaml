apiVersion: apps/v1
kind: Deployment
metadata:
  name: teams-notification-redis
  namespace: teams-notification-uat
  labels:
    app: teams-notification-redis
    environment: uat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teams-notification-redis
  template:
    metadata:
      labels:
        app: teams-notification-redis
        environment: uat
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: teams-notification-secrets
                  key: redis-password
          command:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "200m"
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: teams-notification-uat
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard

---
apiVersion: v1
kind: Service
metadata:
  name: teams-notification-redis
  namespace: teams-notification-uat
  labels:
    app: teams-notification-redis
    environment: uat
spec:
  selector:
    app: teams-notification-redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
