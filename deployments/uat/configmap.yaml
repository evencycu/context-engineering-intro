apiVersion: v1
kind: ConfigMap
metadata:
  name: teams-notification-config
  namespace: teams-notification-uat
  labels:
    app: teams-notification
    environment: uat
data:
  # UAT Environment Configuration
  ENVIRONMENT: "uat"
  LOG_LEVEL: "info"
  PORT: "8080"

  # Database Configuration
  DB_HOST: "teams-notification-postgres"
  DB_PORT: "5432"
  DB_NAME: "teamsnotify"
  DB_USER: "teamsnotify"
  DB_SSL_MODE: "prefer"

  # Redis Configuration
  REDIS_HOST: "teams-notification-redis"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "teamsnotify123"

  # Cache Configuration
  TOKEN_CACHE_TTL: "3600"
  SESSION_CACHE_TTL: "1800"
  DATA_CACHE_TTL: "600"

  # Queue Configuration
  NOTIFICATION_QUEUE_NAME: "notifications_uat"
  TASK_QUEUE_NAME: "tasks_uat"
  RETRY_QUEUE_NAME: "retries_uat"

  # Monitoring Configuration
  METRICS_ENABLED: "true"
  METRICS_PORT: "9090"
  PROMETHEUS_ENABLED: "true"

  # UAT Specific Configuration
  DEBUG_MODE: "false"
  MOCK_EXTERNAL_APIS: "false"
  TEST_DATA_ENABLED: "false"
