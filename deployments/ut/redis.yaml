apiVersion: apps/v1
kind: Deployment
metadata:
  name: teams-notification-redis
  namespace: teams-notification-ut
  labels:
    app: teams-notification-redis
    environment: ut
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teams-notification-redis
  template:
    metadata:
      labels:
        app: teams-notification-redis
        environment: ut
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: teams-notification-secrets
                  key: redis-password
          command:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "100m"
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: teams-notification-redis
  namespace: teams-notification-ut
  labels:
    app: teams-notification-redis
    environment: ut
spec:
  selector:
    app: teams-notification-redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
