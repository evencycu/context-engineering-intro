apiVersion: apps/v1
kind: Deployment
metadata:
  name: teams-notification-postgres
  namespace: teams-notification-ut
  labels:
    app: teams-notification-postgres
    environment: ut
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teams-notification-postgres
  template:
    metadata:
      labels:
        app: teams-notification-postgres
        environment: ut
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "teamsnotify"
            - name: POSTGRES_USER
              value: "teamsnotify"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: teams-notification-secrets
                  key: postgres-password
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "200m"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: teams-notification-postgres
  namespace: teams-notification-ut
  labels:
    app: teams-notification-postgres
    environment: ut
spec:
  selector:
    app: teams-notification-postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
