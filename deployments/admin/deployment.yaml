apiVersion: apps/v1
kind: Deployment
metadata:
  name: teams-notification-admin
  namespace: teams-notification
  labels:
    app: teams-notification-admin
    version: v1.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: teams-notification-admin
  template:
    metadata:
      labels:
        app: teams-notification-admin
        version: v1.0.0
    spec:
      containers:
        - name: admin
          image: teams-notification/admin:v1.0.0
          ports:
            - containerPort: 8081
              name: http
            - containerPort: 9092
              name: metrics
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: CONFIG_PATH
              value: "/etc/config/admin.yaml"
            - name: ADMIN_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: admin-secrets
                  key: jwt-secret
            - name: CSRF_SECRET
              valueFrom:
                secretKeyRef:
                  name: admin-secrets
                  key: csrf-secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: url
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/config
              readOnly: true
            - name: logs
              mountPath: /var/log
      volumes:
        - name: config
          configMap:
            name: admin-config
        - name: logs
          emptyDir: {}
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - teams-notification-admin
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: teams-notification-admin
  namespace: teams-notification
  labels:
    app: teams-notification-admin
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8081
      protocol: TCP
      name: http
    - port: 9092
      targetPort: 9092
      protocol: TCP
      name: metrics
  selector:
    app: teams-notification-admin
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-config
  namespace: teams-notification
data:
  admin.yaml: |
    server:
      host: "0.0.0.0"
      port: 8081
      read_timeout: "30s"
      write_timeout: "30s"
      idle_timeout: "120s"

    database:
      host: "postgres-service"
      port: 5432
      name: "teams_notification"
      ssl_mode: "require"
      max_open_conns: 25
      max_idle_conns: 5

    cache:
      host: "redis-service"
      port: 6379
      db: 0
      pool_size: 10

    auth:
      type: "jwt"
      jwt:
        expires_in: "8h"
        issuer: "teams-notification-admin"

    logging:
      level: "info"
      format: "json"
      output: "stdout"

    monitoring:
      enabled: true
      prometheus:
        enabled: true
        port: 9092
