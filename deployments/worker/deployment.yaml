apiVersion: apps/v1
kind: Deployment
metadata:
  name: teams-notification-worker
  namespace: teams-notification
  labels:
    app: teams-notification-worker
    version: v1.0.0
spec:
  replicas: 5
  selector:
    matchLabels:
      app: teams-notification-worker
  template:
    metadata:
      labels:
        app: teams-notification-worker
        version: v1.0.0
    spec:
      containers:
        - name: worker
          image: teams-notification/worker:v1.0.0
          ports:
            - containerPort: 9091
              name: metrics
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: CONFIG_PATH
              value: "/etc/config/worker.yaml"
            - name: WORKER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TEAMS_APP_ID
              valueFrom:
                secretKeyRef:
                  name: teams-credentials
                  key: app-id
            - name: TEAMS_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: teams-credentials
                  key: app-password
            - name: TEAMS_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: teams-credentials
                  key: tenant-id
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: url
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/config
              readOnly: true
            - name: logs
              mountPath: /var/log
      volumes:
        - name: config
          configMap:
            name: worker-config
        - name: logs
          emptyDir: {}
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - teams-notification-worker
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: teams-notification-worker
  namespace: teams-notification
  labels:
    app: teams-notification-worker
spec:
  type: ClusterIP
  ports:
    - port: 9091
      targetPort: 9091
      protocol: TCP
      name: metrics
  selector:
    app: teams-notification-worker
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-config
  namespace: teams-notification
data:
  worker.yaml: |
    worker:
      name: "notification-worker"
      concurrency: 10
      max_retries: 3
      retry_delay: "5s"

    database:
      host: "postgres-service"
      port: 5432
      name: "teams_notification"
      ssl_mode: "require"
      max_open_conns: 25
      max_idle_conns: 5

    cache:
      host: "redis-service"
      port: 6379
      db: 0
      pool_size: 10

    queue:
      type: "redis"
      redis:
        host: "redis-service"
        port: 6379
        db: 1
        pool_size: 10
        consumer_group: "notification-workers"

    logging:
      level: "info"
      format: "json"
      output: "stdout"

    monitoring:
      enabled: true
      prometheus:
        enabled: true
        port: 9091
