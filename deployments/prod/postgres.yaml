apiVersion: apps/v1
kind: Deployment
metadata:
  name: teams-notification-postgres
  namespace: teams-notification-prod
  labels:
    app: teams-notification-postgres
    environment: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teams-notification-postgres
  template:
    metadata:
      labels:
        app: teams-notification-postgres
        environment: prod
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "teamsnotify"
            - name: POSTGRES_USER
              value: "teamsnotify"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: teams-notification-secrets
                  key: postgres-password
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: teams-notification-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: fast-ssd

---
apiVersion: v1
kind: Service
metadata:
  name: teams-notification-postgres
  namespace: teams-notification-prod
  labels:
    app: teams-notification-postgres
    environment: prod
spec:
  selector:
    app: teams-notification-postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
