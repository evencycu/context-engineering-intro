apiVersion: apps/v1
kind: Deployment
metadata:
  name: teams-notification-api-server
  namespace: teams-notification-prod
  labels:
    app: teams-notification-api-server
    environment: prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: teams-notification-api-server
  template:
    metadata:
      labels:
        app: teams-notification-api-server
        environment: prod
    spec:
      containers:
        - name: api-server
          image: teams-notification/api-server:prod-latest
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: metrics
          env:
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: teams-notification-config
                  key: ENVIRONMENT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: teams-notification-config
                  key: LOG_LEVEL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: teams-notification-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: teams-notification-secrets
                  key: redis-url
            - name: TEAMS_BOT_APP_ID
              valueFrom:
                secretKeyRef:
                  name: teams-notification-secrets
                  key: teams-bot-app-id
            - name: TEAMS_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: teams-notification-secrets
                  key: teams-tenant-id
            - name: TEAMS_BOT_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: teams-notification-secrets
                  key: teams-bot-app-password
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: teams-notification-api-server
  namespace: teams-notification-prod
  labels:
    app: teams-notification-api-server
    environment: prod
spec:
  selector:
    app: teams-notification-api-server
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: metrics
      port: 9090
      targetPort: 9090
  type: LoadBalancer
