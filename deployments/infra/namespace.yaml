apiVersion: v1
kind: Namespace
metadata:
  name: teams-notification
  labels:
    name: teams-notification
    app: teams-notification
---
apiVersion: v1
kind: Secret
metadata:
  name: teams-credentials
  namespace: teams-notification
type: Opaque
data:
  app-id: "" # Base64 encoded Teams App ID
  app-password: "" # Base64 encoded Teams App Password
  tenant-id: "" # Base64 encoded Teams Tenant ID
---
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: teams-notification
type: Opaque
data:
  url: "" # Base64 encoded database URL
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: teams-notification
type: Opaque
data:
  url: "" # Base64 encoded Redis URL
---
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: teams-notification
type: Opaque
data:
  jwt-secret: "" # Base64 encoded JWT secret
---
apiVersion: v1
kind: Secret
metadata:
  name: admin-secrets
  namespace: teams-notification
type: Opaque
data:
  jwt-secret: "" # Base64 encoded admin JWT secret
  csrf-secret: "" # Base64 encoded CSRF secret
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: teams-notification-quota
  namespace: teams-notification
spec:
  hard:
    requests.cpu: "2"
    requests.memory: "4Gi"
    limits.cpu: "4"
    limits.memory: "8Gi"
    persistentvolumeclaims: "4"
    pods: "20"
    services: "10"
    secrets: "10"
    configmaps: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: teams-notification-limits
  namespace: teams-notification
spec:
  limits:
    - default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "250m"
        memory: "256Mi"
      type: Container
    - max:
        cpu: "1"
        memory: "1Gi"
      min:
        cpu: "100m"
        memory: "128Mi"
      type: Container
