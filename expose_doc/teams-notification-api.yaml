
openapi: 3.0.3
info:
  title: Teams Notification API (Go implementation)
  version: 1.0.0
  description: |
    This specification documents the REST endpoints implemented in `cmd/server/main.go`.
    Only the routes listed here are currently available. Future features like billing analytics
    and scheduled notifications are not included.
servers:
  - url: http://localhost:8080
    description: Local development (default configuration)
paths:
  /health:
    get:
      summary: Service health check
      tags: [System]
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/companies:
    get:
      summary: List companies
      tags: [Companies]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/Order'
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Company collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCompanies'
    post:
      summary: Create company
      tags: [Companies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyCreateRequest'
      responses:
        '201':
          description: Created company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
  /api/v1/companies/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      summary: Get company
      tags: [Companies]
      responses:
        '200':
          description: Company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
    put:
      summary: Update company
      tags: [Companies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyUpdateRequest'
      responses:
        '200':
          description: Updated company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
    delete:
      summary: Delete company
      tags: [Companies]
      responses:
        '204':
          description: Deleted
  /api/v1/companies/{id}/status:
    patch:
      summary: Update company status
      tags: [Companies]
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, inactive, suspended]
      responses:
        '200':
          description: Updated company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
  /api/v1/companies/{id}/billing:
    patch:
      summary: Update company billing enabled flag
      tags: [Companies]
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: Updated company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
  /api/v1/users:
    get:
      summary: List users
      tags: [Users]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/Order'
        - name: role
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: User collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
    post:
      summary: Create user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
  /api/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      summary: Get user
      tags: [Users]
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    put:
      summary: Update user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    delete:
      summary: Delete user
      tags: [Users]
      responses:
        '204':
          description: Deleted
  /api/v1/users/{id}/password:
    patch:
      summary: Change user password
      tags: [Users]
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password:
                  type: string
                new_password:
                  type: string
      responses:
        '200':
          description: Password updated
  /api/v1/users/{id}/api-key:
    patch:
      summary: Generate API key (persistence TODO)
      tags: [Users]
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: API key payload
    delete:
      summary: Revoke API key (persistence TODO)
      tags: [Users]
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '204':
          description: Revoked
  /api/v1/users/company/{companyId}:
    get:
      summary: List users by company
      tags: [Users]
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User list
  /api/v1/users/role/{role}:
    get:
      summary: List users by role
      tags: [Users]
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User list
  /api/v1/projects:
    get:
      summary: List projects
      tags: [Projects]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Project collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjects'
    post:
      summary: Create project
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
      responses:
        '201':
          description: Created project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
  /api/v1/projects/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      summary: Get project
      tags: [Projects]
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
    put:
      summary: Update project
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
    delete:
      summary: Delete project
      tags: [Projects]
      responses:
        '204':
          description: Deleted
  /api/v1/projects/{id}/limits:
    patch:
      summary: Update project limits
      tags: [Projects]
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                daily_limit:
                  type: integer
                monthly_limit:
                  type: integer
      responses:
        '200':
          description: Updated project
  /api/v1/projects/company/{companyId}:
    get:
      summary: List projects by company
      tags: [Projects]
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Project list
  /api/v1/projects/key/{keyName}:
    get:
      summary: Get project by notify key
      tags: [Projects]
      parameters:
        - name: keyName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
  /api/v1/bots/platform:
    get:
      summary: List platform bots
      tags: [Bots]
      responses:
        '200':
          description: Bot list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotListResponse'
    post:
      summary: Create platform bot
      tags: [Bots]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotCreateRequest'
      responses:
        '201':
          description: Created bot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotResponse'
  /api/v1/bots/platform/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      summary: Get platform bot
      tags: [Bots]
      responses:
        '200':
          description: Bot payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotResponse'
    put:
      summary: Update platform bot
      tags: [Bots]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotUpdateRequest'
      responses:
        '200':
          description: Updated bot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotResponse'
    delete:
      summary: Delete platform bot
      tags: [Bots]
      responses:
        '204':
          description: Deleted
  /api/v1/bots/platform/{id}/status:
    patch:
      summary: Update bot status
      tags: [Bots]
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, inactive, suspended, maintenance]
      responses:
        '200':
          description: Updated bot
  /api/v1/bots/platform/{id}/capabilities:
    patch:
      summary: Update bot capabilities
      tags: [Bots]
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Updated bot
  /api/v1/bots/platform/{id}/test:
    post:
      summary: Test bot connection
      tags: [Bots]
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Test result
  /api/v1/bots/status/{status}:
    get:
      summary: List bots by status
      tags: [Bots]
      parameters:
        - name: status
          in: path
          required: true
          schema:
            type: string
            enum: [active, inactive, suspended, maintenance]
      responses:
        '200':
          description: Bot list
  /api/v1/destinations:
    get:
      summary: List destinations
      tags: [Destinations]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/Order'
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Destination collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDestinations'
    post:
      summary: Create destination
      tags: [Destinations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationCreateRequest'
      responses:
        '201':
          description: Created destination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationResponse'
  /api/v1/destinations/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      summary: Get destination
      tags: [Destinations]
      responses:
        '200':
          description: Destination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationResponse'
    put:
      summary: Update destination
      tags: [Destinations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationUpdateRequest'
      responses:
        '200':
          description: Updated destination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationResponse'
    delete:
      summary: Delete destination
      tags: [Destinations]
      responses:
        '204':
          description: Deleted
  /api/v1/destinations/{id}/targets:
    patch:
      summary: Update destination targets
      tags: [Destinations]
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationTargetsRequest'
      responses:
        '200':
          description: Updated destination
  /api/v1/destinations/{id}/validate:
    post:
      summary: Validate destination targets
      tags: [Destinations]
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Validation result
  /api/v1/destinations/project/{projectId}:
    get:
      summary: List destinations by project
      tags: [Destinations]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Destination list
  /api/v1/destinations/bot/{botId}:
    get:
      summary: List destinations by bot
      tags: [Destinations]
      parameters:
        - name: botId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Destination list
  /api/v1/destinations/search:
    get:
      summary: Search destinations
      tags: [Destinations]
      parameters:
        - name: target_type
          in: query
          schema:
            type: string
            enum: [person, channel, chatgroup]
        - name: target_id
          in: query
          schema:
            type: string
        - name: team_id
          in: query
          schema:
            type: string
        - name: channel_id
          in: query
          schema:
            type: string
        - name: user_id
          in: query
          schema:
            type: string
        - name: group_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Destination list
  /api/v1/notifications:
    get:
      summary: List notifications
      tags: [Notifications]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/Order'
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Notification list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotifications'
    post:
      summary: Send notification
      tags: [Notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationSendRequest'
      responses:
        '202':
          description: Notification queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationEnqueueResponse'
  /api/v1/notifications/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      summary: Get notification
      tags: [Notifications]
      responses:
        '200':
          description: Notification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
    delete:
      summary: Cancel notification
      tags: [Notifications]
      responses:
        '204':
          description: Cancelled
  /api/v1/notifications/{id}/retry:
    post:
      summary: Retry notification
      tags: [Notifications]
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Retry accepted
  /api/v1/notifications/project/{projectId}:
    get:
      summary: List notifications by project
      tags: [Notifications]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification list
  /api/v1/notifications/sender/{senderId}:
    get:
      summary: List notifications by sender
      tags: [Notifications]
      parameters:
        - name: senderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification list
  /api/v1/notifications/status/{status}:
    get:
      summary: List notifications by status
      tags: [Notifications]
      parameters:
        - name: status
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification list
  /api/v1/notifications/date-range:
    get:
      summary: List notifications in date range
      tags: [Notifications]
      parameters:
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Notification list
  /api/v1/messages:
    post:
      summary: Bot Framework inbound message webhook
      tags: [Messages]
      responses:
        '200':
          description: Acknowledged
  /api/v1/messages/proactive/test:
    post:
      summary: Send proactive test message
      tags: [Messages]
      responses:
        '200':
          description: Test result
  /api/v1/provision:
    post:
      summary: Provision company/project/destination bundle
      tags: [Provision]
      responses:
        '201':
          description: Created bundle
  /api/v1/provision/{notify_key}:
    parameters:
      - name: notify_key
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get provision bundle by notify key
      tags: [Provision]
      responses:
        '200':
          description: Provision bundle
    put:
      summary: Update provision bundle
      tags: [Provision]
      responses:
        '200':
          description: Updated bundle
  /api/v1/provision/{notify_key}/enable:
    post:
      summary: Enable provisioned project
      tags: [Provision]
      parameters:
        - name: notify_key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Enabled
  /api/v1/provision/{notify_key}/disable:
    post:
      summary: Disable provisioned project
      tags: [Provision]
      parameters:
        - name: notify_key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Disabled
components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
    SortBy:
      name: sort_by
      in: query
      schema:
        type: string
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        timestamp:
          type: string
          format: date-time
        version:
          type: string
    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        contact_email:
          type: string
        contact_phone:
          type: string
        address:
          type: string
        status:
          type: string
        billing_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CompanyCreateRequest:
      type: object
      required: [name, contact_email, contact_phone, address]
      properties:
        name:
          type: string
        contact_email:
          type: string
        contact_phone:
          type: string
        address:
          type: string
        billing_enabled:
          type: boolean
    CompanyUpdateRequest:
      type: object
      properties:
        name:
          type: string
        contact_email:
          type: string
        contact_phone:
          type: string
        address:
          type: string
        billing_enabled:
          type: boolean
    CompanyResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Company'
        message:
          type: string
    PaginatedCompanies:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Company'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        pages:
          type: integer
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          type: string
        status:
          type: string
        last_login_at:
          type: string
          format: date-time
    UserCreateRequest:
      type: object
      required: [company_id, email, name]
      properties:
        company_id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          type: string
        password:
          type: string
    UserUpdateRequest:
      type: object
      properties:
        company_id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          type: string
        status:
          type: string
        password:
          type: string
    UserResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/User'
    PaginatedUsers:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        notify_key:
          type: string
        description:
          type: string
        status:
          type: string
        daily_limit:
          type: integer
        monthly_limit:
          type: integer
        priority:
          type: string
        created_by:
          type: string
          format: uuid
    ProjectCreateRequest:
      type: object
      required: [company_id, notify_key, description, created_by]
      properties:
        company_id:
          type: string
          format: uuid
        notify_key:
          type: string
        description:
          type: string
        daily_limit:
          type: integer
        monthly_limit:
          type: integer
