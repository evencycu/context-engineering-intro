          misses: 5
          total_keys: 7
        actor_pool:
          queue_size: 4
          total_actors: 2
          idle_actors: 3
          active_actors: 9
        timestamp: 2000-01-23T04:56:07.000+00:00
      properties:
        timestamp:
          format: date-time
          type: string
        system:
