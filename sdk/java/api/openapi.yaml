      style: simple
  responses:
    BadRequestError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Bad request
    UnauthorizedError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Unauthorized
    NotFoundError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Not found
    InternalServerError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Internal server error
  schemas:
    ErrorResponse:
      example:
        details: details
        error: error
        timestamp: 2000-01-23T04:56:07.000+00:00
      properties:
        error:
          description: Error message
          type: string
        details:
          description: Detailed error information
          type: string
        timestamp:
          description: Error timestamp
          format: date-time
          type: string
      type: object
    HealthResponse:
      example:
        version: version
        status: healthy
        timestamp: 2000-01-23T04:56:07.000+00:00
        uptime: uptime
      properties:
        status:
          enum:
          - healthy
          - unhealthy
          type: string
        timestamp:
          format: date-time
          type: string
        version:
          type: string
        uptime:
          type: string
      type: object
