openapi: 3.0.3
info:
  description: |
    This specification documents the REST endpoints implemented in the Teams Notification Go service.
    Includes all available routes for internal and external APIs.

    ## API Structure
    - **External APIs** (`/api/v1`): Public APIs for external clients
    - **Internal APIs** (`/internal/v1`): Internal management APIs
    - **System APIs**: Health, metrics, and configuration endpoints

    ## Recent Updates (v1.0.0)
    - **Unified Configuration**: Environment-based configuration system
    - **Error Handling**: Standardized error responses with proper HTTP status codes
    - **Token Management**: Redis-backed token caching for improved performance
    - **Monitoring**: Enhanced health checks and system metrics
    - **Logging**: Structured logging with configurable levels and formats
  title: Teams Notification API (Go implementation)
  version: 1.0.0
servers:
- description: Local development server
  url: http://localhost:8080
- description: Production server
  url: https://api.teamsnotify.com
tags:
- description: System health and configuration endpoints
  name: System
- description: Public APIs for external clients
  name: External API
- description: Company management APIs
  name: Internal API - Companies
- description: User management APIs
  name: Internal API - Users
- description: Project management APIs
  name: Internal API - Projects
- description: Bot management APIs
  name: Internal API - Bots
- description: Destination management APIs
  name: Internal API - Destinations
- description: Notification management APIs
  name: Internal API - Notifications
- description: Billing management APIs
  name: Internal API - Billing
- description: File management APIs
  name: Internal API - Files
- description: Monitoring and analytics APIs
  name: Internal API - Monitoring
paths:
  /health:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: Health status
      summary: Service health check
      tags:
      - System
      x-accepts:
      - application/json
  /metrics:
    get:
      description: "Returns system metrics including token cache statistics, actor\
        \ pool status, and performance indicators"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsResponse"
          description: System metrics
      summary: System metrics
      tags:
      - System
      x-accepts:
      - application/json
  /config:
    get:
      description: Returns current system configuration (non-sensitive values only)
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigResponse"
          description: System configuration
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: Get system configuration
      tags:
      - System
      x-accepts:
