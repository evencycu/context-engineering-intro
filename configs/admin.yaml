# Admin Service Configuration
server:
  host: "0.0.0.0"
  port: 8081
  read_timeout: "30s"
  write_timeout: "30s"
  idle_timeout: "120s"
  max_header_bytes: 1048576 # 1MB

# Database Configuration
database:
  host: "localhost"
  port: 5432
  name: "teams_notification"
  username: "postgres"
  password: "password"
  ssl_mode: "disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: "1h"
  conn_max_idle_time: "30m"

# Redis Cache Configuration
cache:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 5
  max_conn_age: "1h"
  idle_timeout: "5m"
  idle_check_frequency: "1m"

# Authentication Configuration
auth:
  type: "jwt" # jwt, api_key, oauth2
  jwt:
    secret: "${ADMIN_JWT_SECRET}"
    expires_in: "8h"
    issuer: "teams-notification-admin"
  api_key:
    header: "X-Admin-API-Key"
    cache_ttl: "1h"
  oauth2:
    provider: "azure"
    client_id: "${ADMIN_OAUTH2_CLIENT_ID}"
    client_secret: "${ADMIN_OAUTH2_CLIENT_SECRET}"
    redirect_url: "${ADMIN_OAUTH2_REDIRECT_URL}"
    scopes: ["https://graph.microsoft.com/.default"]

# Admin Permissions
permissions:
  super_admin:
    - "destinations:create"
    - "destinations:read"
    - "destinations:update"
    - "destinations:delete"
    - "users:create"
    - "users:read"
    - "users:update"
    - "users:delete"
    - "billing:read"
    - "billing:update"
    - "system:read"
    - "system:update"
  admin:
    - "destinations:create"
    - "destinations:read"
    - "destinations:update"
    - "users:read"
    - "billing:read"
  operator:
    - "destinations:read"
    - "users:read"

# Rate Limiting Configuration
rate_limit:
  enabled: true
  requests_per_minute: 200
  burst_size: 50
  cleanup_interval: "1m"

# Logging Configuration
logging:
  level: "info" # debug, info, warn, error
  format: "json" # json, text
  output: "stdout" # stdout, stderr, file
  file_path: "/var/log/admin.log"
  max_size: 100 # MB
  max_backups: 3
  max_age: 28 # days
  compress: true

# Monitoring Configuration
monitoring:
  enabled: true
  metrics_path: "/metrics"
  health_path: "/health"
  prometheus:
    enabled: true
    port: 9092
  jaeger:
    enabled: false
    endpoint: "http://localhost:14268/api/traces"
    service_name: "teams-notification-admin"

# Destination Management
destinations:
  auto_approve: false
  approval_timeout: "24h"
  max_destinations_per_company: 1000
  validation:
    enabled: true
    check_teams_access: true
    check_user_permissions: true
    timeout: "30s"

# User Management
users:
  default_role: "operator"
  password_policy:
    min_length: 8
    require_uppercase: true
    require_lowercase: true
    require_numbers: true
    require_special_chars: true
    max_age_days: 90
  session:
    timeout: "8h"
    max_concurrent: 5

# Billing Configuration
billing:
  enabled: true
  currency: "USD"
  pricing:
    per_notification: 0.001
    per_attachment: 0.005
    per_mention: 0.0005
  invoice:
    generation_interval: "monthly"
    due_days: 30
    template: "default"

# Notification Management
notifications:
  max_retention_days: 90
  anonymize_after_days: 30
  export_format: "json" # json, csv, xlsx
  batch_export_size: 1000

# System Configuration
system:
  maintenance_mode: false
  backup:
    enabled: true
    interval: "daily"
    retention_days: 30
    storage_path: "/var/backups"
  alerts:
    enabled: true
    channels: ["email", "teams"]
    thresholds:
      error_rate: 0.05
      response_time: 2000 # ms
      queue_size: 1000

# Security Configuration
security:
  cors:
    enabled: true
    allowed_origins: ["https://admin.company.com"]
    allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    allowed_headers: ["*"]
    max_age: 86400
  csrf:
    enabled: true
    secret: "${CSRF_SECRET}"
  xss:
    enabled: true
  content_security_policy:
    enabled: true
    policy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'"
  rate_limiting:
    login_attempts: 5
    lockout_duration: "15m"
    ip_whitelist: []

# Feature Flags
features:
  destination_management: true
  user_management: true
  billing_management: true
  analytics_dashboard: true
  audit_logs: true
  system_monitoring: true
  maintenance_mode: true

# Environment
environment: "development" # development, staging, production
