# API Server Configuration
server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: "30s"
  write_timeout: "30s"
  idle_timeout: "120s"
  max_header_bytes: 1048576 # 1MB

# Database Configuration
database:
  host: "localhost"
  port: 5432
  name: "teams_notification"
  username: "postgres"
  password: "password"
  ssl_mode: "disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: "1h"
  conn_max_idle_time: "30m"

# Redis Cache Configuration
cache:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 5
  max_conn_age: "1h"
  idle_timeout: "5m"
  idle_check_frequency: "1m"

# Message Queue Configuration
queue:
  type: "redis" # redis, kafka, rabbitmq
  redis:
    host: "localhost"
    port: 6379
    password: ""
    db: 1
    pool_size: 10
  kafka:
    brokers: ["localhost:9092"]
    topic: "notifications"
    group_id: "notification-service"
  rabbitmq:
    url: "amqp://guest:guest@localhost:5672/"
    exchange: "notifications"
    queue: "notification_queue"

# Teams Bot Configuration
teams:
  app_id: "${TEAMS_APP_ID}"
  app_password: "${TEAMS_APP_PASSWORD}"
  tenant_id: "${TEAMS_TENANT_ID}"
  base_url: "https://smba.trafficmanager.net/apis"
  timeout: "30s"
  retry_attempts: 3
  retry_delay: "1s"

# Authentication Configuration
auth:
  type: "jwt" # jwt, api_key, oauth2
  jwt:
    secret: "${JWT_SECRET}"
    expires_in: "24h"
    issuer: "teams-notification-api"
  api_key:
    header: "X-API-Key"
    cache_ttl: "1h"
  oauth2:
    provider: "azure"
    client_id: "${OAUTH2_CLIENT_ID}"
    client_secret: "${OAUTH2_CLIENT_SECRET}"
    redirect_url: "${OAUTH2_REDIRECT_URL}"
    scopes: ["https://graph.microsoft.com/.default"]

# Rate Limiting Configuration
rate_limit:
  enabled: true
  requests_per_minute: 100
  burst_size: 20
  cleanup_interval: "1m"

# Logging Configuration
logging:
  level: "info" # debug, info, warn, error
  format: "json" # json, text
  output: "stdout" # stdout, stderr, file
  file_path: "/var/log/api-server.log"
  max_size: 100 # MB
  max_backups: 3
  max_age: 28 # days
  compress: true

# Monitoring Configuration
monitoring:
  enabled: true
  metrics_path: "/metrics"
  health_path: "/health"
  prometheus:
    enabled: true
    port: 9090
  jaeger:
    enabled: false
    endpoint: "http://localhost:14268/api/traces"
    service_name: "teams-notification-api"

# Notification Configuration
notification:
  max_batch_size: 100
  max_retry_attempts: 3
  retry_delay: "5s"
  retry_backoff_multiplier: 2.0
  max_retry_delay: "5m"
  cleanup_interval: "1h"
  max_notification_age: "24h"

# Destination Management Configuration
destinations:
  cache_ttl: "1h"
  validation_interval: "5m"
  max_destinations_per_key: 1000

# Security Configuration
security:
  cors:
    enabled: true
    allowed_origins: ["*"]
    allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    allowed_headers: ["*"]
    max_age: 86400
  csrf:
    enabled: false
  xss:
    enabled: true
  content_security_policy:
    enabled: true
    policy: "default-src 'self'"

# Feature Flags
features:
  scheduled_notifications: true
  file_attachments: true
  mentions: true
  webhooks: false
  analytics: true
  billing: true

# Environment
environment: "development" # development, staging, production
