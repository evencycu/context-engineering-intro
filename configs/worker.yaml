# Worker Configuration
worker:
  name: "notification-worker"
  concurrency: 10
  max_retries: 3
  retry_delay: "5s"
  retry_backoff_multiplier: 2.0
  max_retry_delay: "5m"
  shutdown_timeout: "30s"

# Database Configuration
database:
  host: "localhost"
  port: 5432
  name: "teams_notification"
  username: "postgres"
  password: "password"
  ssl_mode: "disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: "1h"
  conn_max_idle_time: "30m"

# Redis Cache Configuration
cache:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 5
  max_conn_age: "1h"
  idle_timeout: "5m"
  idle_check_frequency: "1m"

# Message Queue Configuration
queue:
  type: "redis" # redis, kafka, rabbitmq
  redis:
    host: "localhost"
    port: 6379
    password: ""
    db: 1
    pool_size: 10
    consumer_group: "notification-workers"
    consumer_name: "worker-1"
  kafka:
    brokers: ["localhost:9092"]
    topic: "notifications"
    group_id: "notification-workers"
    partition: 0
  rabbitmq:
    url: "amqp://guest:guest@localhost:5672/"
    exchange: "notifications"
    queue: "notification_queue"
    prefetch_count: 10

# Teams Bot Configuration
teams:
  app_id: "${TEAMS_APP_ID}"
  app_password: "${TEAMS_APP_PASSWORD}"
  tenant_id: "${TEAMS_TENANT_ID}"
  base_url: "https://smba.trafficmanager.net/apis"
  timeout: "30s"
  retry_attempts: 3
  retry_delay: "1s"
  rate_limit:
    requests_per_second: 10
    burst_size: 20

# Logging Configuration
logging:
  level: "info" # debug, info, warn, error
  format: "json" # json, text
  output: "stdout" # stdout, stderr, file
  file_path: "/var/log/worker.log"
  max_size: 100 # MB
  max_backups: 3
  max_age: 28 # days
  compress: true

# Monitoring Configuration
monitoring:
  enabled: true
  metrics_path: "/metrics"
  health_path: "/health"
  prometheus:
    enabled: true
    port: 9091
  jaeger:
    enabled: false
    endpoint: "http://localhost:14268/api/traces"
    service_name: "notification-worker"

# Processing Configuration
processing:
  batch_size: 100
  batch_timeout: "10s"
  max_processing_time: "5m"
  cleanup_interval: "1h"
  dead_letter_queue:
    enabled: true
    max_retries: 3
    ttl: "24h"

# Teams API Rate Limiting
teams_rate_limit:
  enabled: true
  requests_per_minute: 600
  burst_size: 100
  cleanup_interval: "1m"
  backoff_strategy: "exponential"

# Error Handling
error_handling:
  max_consecutive_errors: 10
  error_threshold_duration: "5m"
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    recovery_timeout: "1m"
    half_open_max_calls: 3

# Environment
environment: "development" # development, staging, production
