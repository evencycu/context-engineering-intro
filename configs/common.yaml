# Common Configuration for All Services

# Application Information
app:
  name: "Teams Notification Service"
  version: "1.0.0"
  description: "Enterprise-grade Teams notification API server"
  author: "DW Team"

# Environment Configuration
environment: "development" # development, staging, production
debug: false

# Database Configuration (Common)
database:
  driver: "postgres"
  host: "localhost"
  port: 5432
  name: "teams_notification"
  username: "postgres"
  password: "password"
  ssl_mode: "disable"
  timezone: "UTC"
  charset: "utf8mb4"
  collation: "utf8mb4_unicode_ci"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: "1h"
  conn_max_idle_time: "30m"
  slow_query_threshold: "200ms"
  query_timeout: "30s"

# Redis Configuration (Common)
redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 5
  max_conn_age: "1h"
  idle_timeout: "5m"
  idle_check_frequency: "1m"
  dial_timeout: "5s"
  read_timeout: "3s"
  write_timeout: "3s"

# Logging Configuration (Common)
logging:
  level: "info" # debug, info, warn, error
  format: "json" # json, text
  output: "stdout" # stdout, stderr, file
  file_path: "/var/log/teams-notification.log"
  max_size: 100 # MB
  max_backups: 3
  max_age: 28 # days
  compress: true
  local_time: true
  caller: true
  stacktrace: true

# Monitoring Configuration (Common)
monitoring:
  enabled: true
  metrics_path: "/metrics"
  health_path: "/health"
  readiness_path: "/ready"
  liveness_path: "/live"
  prometheus:
    enabled: true
    port: 9090
    path: "/metrics"
  jaeger:
    enabled: false
    endpoint: "http://localhost:14268/api/traces"
    service_name: "teams-notification"
    sampler_type: "const"
    sampler_param: 1.0
  pprof:
    enabled: false
    port: 6060
    path: "/debug/pprof"

# Security Configuration (Common)
security:
  tls:
    enabled: false
    cert_file: "/etc/ssl/certs/server.crt"
    key_file: "/etc/ssl/private/server.key"
    min_version: "1.2"
  cors:
    enabled: true
    allowed_origins: ["*"]
    allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    allowed_headers: ["*"]
    exposed_headers: []
    max_age: 86400
    allow_credentials: false
  csrf:
    enabled: false
    secret: "${CSRF_SECRET}"
    token_length: 32
    cookie_name: "csrf_token"
    header_name: "X-CSRF-Token"
  xss:
    enabled: true
    policy: "strict"
  content_security_policy:
    enabled: true
    policy: "default-src 'self'"
  rate_limiting:
    enabled: true
    requests_per_minute: 100
    burst_size: 20
    cleanup_interval: "1m"
    ip_whitelist: []
    ip_blacklist: []

# Teams Configuration (Common)
teams:
  app_id: "${TEAMS_APP_ID}"
  app_password: "${TEAMS_APP_PASSWORD}"
  tenant_id: "${TEAMS_TENANT_ID}"
  base_url: "https://smba.trafficmanager.net/apis"
  timeout: "30s"
  retry_attempts: 3
  retry_delay: "1s"
  retry_backoff_multiplier: 2.0
  max_retry_delay: "5m"
  rate_limit:
    enabled: true
    requests_per_second: 10
    burst_size: 20
    cleanup_interval: "1m"
  webhook:
    enabled: false
    url: "${TEAMS_WEBHOOK_URL}"
    secret: "${TEAMS_WEBHOOK_SECRET}"

# Message Queue Configuration (Common)
queue:
  type: "redis" # redis, kafka, rabbitmq
  redis:
    host: "localhost"
    port: 6379
    password: ""
    db: 1
    pool_size: 10
    consumer_group: "teams-notification"
    consumer_name: "worker"
  kafka:
    brokers: ["localhost:9092"]
    topic: "notifications"
    group_id: "teams-notification"
    partition: 0
    offset: "latest"
    retention: "7d"
  rabbitmq:
    url: "amqp://guest:guest@localhost:5672/"
    exchange: "notifications"
    queue: "notification_queue"
    routing_key: "notification"
    prefetch_count: 10
    durable: true
    auto_delete: false

# Cache Configuration (Common)
cache:
  type: "redis" # redis, memory
  redis:
    host: "localhost"
    port: 6379
    password: ""
    db: 2
    pool_size: 10
    min_idle_conns: 5
    max_conn_age: "1h"
    idle_timeout: "5m"
    idle_check_frequency: "1m"
  memory:
    max_size: "100MB"
    cleanup_interval: "10m"
  default_ttl: "1h"
  max_ttl: "24h"

# Notification Configuration (Common)
notification:
  max_batch_size: 100
  max_retry_attempts: 3
  retry_delay: "5s"
  retry_backoff_multiplier: 2.0
  max_retry_delay: "5m"
  cleanup_interval: "1h"
  max_notification_age: "24h"
  max_message_length: 4000
  max_attachment_size: "10MB"
  allowed_file_types:
    [
      "pdf",
      "doc",
      "docx",
      "xls",
      "xlsx",
      "ppt",
      "pptx",
      "txt",
      "jpg",
      "jpeg",
      "png",
      "gif",
    ]

# Destination Management (Common)
destinations:
  cache_ttl: "1h"
  validation_interval: "5m"
  max_destinations_per_key: 1000
  validation:
    enabled: true
    check_teams_access: true
    check_user_permissions: true
    timeout: "30s"
  approval:
    required: true
    timeout: "24h"
    auto_approve_whitelist: []

# Billing Configuration (Common)
billing:
  enabled: true
  currency: "USD"
  pricing:
    per_notification: 0.001
    per_attachment: 0.005
    per_mention: 0.0005
    per_scheduled: 0.002
  invoice:
    generation_interval: "monthly"
    due_days: 30
    template: "default"
  limits:
    daily_notifications: 10000
    monthly_notifications: 300000
    max_attachment_size: "10MB"

# Feature Flags (Common)
features:
  scheduled_notifications: true
  file_attachments: true
  mentions: true
  webhooks: false
  analytics: true
  billing: true
  admin_panel: true
  audit_logs: true
  maintenance_mode: false

# Error Handling (Common)
error_handling:
  max_consecutive_errors: 10
  error_threshold_duration: "5m"
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    recovery_timeout: "1m"
    half_open_max_calls: 3
  retry:
    max_attempts: 3
    initial_delay: "1s"
    max_delay: "5m"
    backoff_multiplier: 2.0

# Performance Configuration (Common)
performance:
  max_concurrent_requests: 1000
  request_timeout: "30s"
  response_timeout: "25s"
  keep_alive: true
  keep_alive_timeout: "30s"
  max_idle_conns: 100
  max_idle_conns_per_host: 10
  idle_conn_timeout: "90s"
  tls_handshake_timeout: "10s"
  expect_continue_timeout: "1s"

# Environment Variables
env:
  prefix: "TEAMS_NOTIFICATION_"
  required:
    - "TEAMS_APP_ID"
    - "TEAMS_APP_PASSWORD"
    - "TEAMS_TENANT_ID"
  optional:
    - "JWT_SECRET"
    - "CSRF_SECRET"
    - "OAUTH2_CLIENT_ID"
    - "OAUTH2_CLIENT_SECRET"
