version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: teamsnotify-postgres
    environment:
      POSTGRES_DB: notification_center
      POSTGRES_USER: teamsnotify
      POSTGRES_PASSWORD: teamsnotify123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - teamsnotify_postgres_data:/var/lib/postgresql/data
      - ./internal/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./internal/database/init.sql:/docker-entrypoint-initdb.d/02-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamsnotify -d notification_center"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: teamsnotify-redis
    ports:
      - "6379:6379"
    volumes:
      - teamsnotify_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  teamsnotify_postgres_data:
    driver: local
  teamsnotify_redis_data:
    driver: local

networks:
  teamsnotify-network:
    driver: bridge
