openapi: 3.0.3
info:
  title: Teams Notification API (Go implementation)
  version: 1.0.0
  description: |
    This specification documents the REST endpoints implemented in the Teams Notification Go service.
    Includes all available routes for internal and external APIs.

    ## API Structure
    - **External APIs** (`/api/v1`): Public APIs for external clients
    - **Internal APIs** (`/internal/v1`): Internal management APIs
    - **System APIs**: Health, metrics, and configuration endpoints

    ## Recent Updates (v1.0.0)
    - **Unified Configuration**: Environment-based configuration system
    - **Error Handling**: Standardized error responses with proper HTTP status codes
    - **Token Management**: Redis-backed token caching for improved performance
    - **Monitoring**: Enhanced health checks and system metrics
    - **Logging**: Structured logging with configurable levels and formats

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.teamsnotify.com
    description: Production server

paths:
  # System endpoints
  /health:
    get:
      summary: Service health check
      tags: [System]
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /metrics:
    get:
      summary: System metrics
      tags: [System]
      description: Returns system metrics including token cache statistics, actor pool status, and performance indicators
      responses:
        "200":
          description: System metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsResponse"

  /config:
    get:
      summary: Get system configuration
      tags: [System]
      description: Returns current system configuration (non-sensitive values only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: System configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /config/validate:
    post:
      summary: Validate system configuration
      tags: [System]
      description: Validates the current system configuration
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Configuration validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigValidationResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  # External API endpoints (/api/v1)
  /api/v1/notify:
    post:
      summary: Send notification (External API)
      tags: [External API]
      description: Send a notification to Teams using project notify key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalNotifyRequest"
      responses:
        "200":
          description: Notification sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalNotifyResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/destinations/{notifyKey}:
    get:
      summary: Get project destinations (External API)
      tags: [External API]
      description: Get destinations for a project using notify key
      parameters:
        - name: notifyKey
          in: path
          required: true
          schema:
            type: string
          description: Project notify key
      responses:
        "200":
          description: Project destinations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDestinationsResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/provision:
    post:
      summary: Create project provision
      tags: [External API]
      description: Create a new project provision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionCreateRequest"
      responses:
        "201":
          description: Project provision created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisionResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"

  /api/v1/provision/{notifyKey}:
    get:
      summary: Get project provision
      tags: [External API]
      description: Get project provision by notify key
      parameters:
        - name: notifyKey
          in: path
          required: true
          schema:
            type: string
          description: Project notify key
      responses:
        "200":
          description: Project provision details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisionResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"

    put:
      summary: Update project provision
      tags: [External API]
      description: Update project provision by notify key
      parameters:
        - name: notifyKey
          in: path
          required: true
          schema:
            type: string
          description: Project notify key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionUpdateRequest"
      responses:
        "200":
          description: Project provision updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisionResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/provision/{notifyKey}/enable:
    post:
      summary: Enable project provision
      tags: [External API]
      description: Enable project provision by notify key
      parameters:
        - name: notifyKey
          in: path
          required: true
          schema:
            type: string
          description: Project notify key
      responses:
        "200":
          description: Project provision enabled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisionResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/provision/{notifyKey}/disable:
    post:
      summary: Disable project provision
      tags: [External API]
      description: Disable project provision by notify key
      parameters:
        - name: notifyKey
          in: path
          required: true
          schema:
            type: string
          description: Project notify key
      responses:
        "200":
          description: Project provision disabled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisionResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/messages:
    post:
      summary: Handle Bot Framework messages
      tags: [External API]
      description: Handle incoming Bot Framework Activity messages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotFrameworkActivity"
      responses:
        "200":
          description: Message processed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /api/v1/messages/test:
    post:
      summary: Test proactive message
      tags: [External API]
      description: Send a test proactive message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProactiveTestRequest"
      responses:
        "200":
          description: Test message sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # Internal API endpoints (/internal/v1)
  /internal/v1/companies:
    get:
      summary: List companies
      tags: [Internal API - Companies]
      description: Get a list of companies with pagination
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
