    # External API Schemas
    ExternalNotificationRequest:
      type: object
      required:
        - notify_key
        - message
      properties:
        notify_key:
          type: string
          description: Project notification key
          example: "my-project-key"
          minLength: 3
          maxLength: 50
        message:
          type: string
          description: Message content to send
          example: "Hello from external API"
          minLength: 1
          maxLength: 4000
        message_type:
          type: string
          description: Type of message
          enum: [text, file, adaptive_card]
          default: text
          example: "text"
        priority:
          type: string
          description: Message priority
          enum: [low, normal, high]
          default: normal
          example: "normal"
        targets:
          type: array
          description: List of target Emails or Conversation IDs or 'all' for all targets
          items:
            type: string
          example: ["all"]
        mentions:
          type: array
          description: List of users to mention
          items:
            type: string
          example: ["@user1", "@user2"]
        metadata:
          type: object
          description: Additional metadata
          example: { "source": "external", "version": "1.0" }

    ExternalNotificationResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            notification_id:
              type: string
              example: "123e4567-e89b-12d3-a456-426614174000"
            status:
              type: string
              enum: [sent, partial, failed]
              example: "sent"
            message:
              type: string
              example: "Notification processed successfully"
            project_id:
              type: string
              example: "123e4567-e89b-12d3-a456-426614174000"
            project_name:
              type: string
              example: "my-project-key"
            destinations_count:
              type: integer
              example: 3
            results:
              type: array
              items:
                $ref: "#/components/schemas/ExternalDestinationResult"
            estimated_delivery:
              type: string
              example: "5-10 minutes"
        error:
          type: string
          example: ""

    ExternalDestinationResult:
      type: object
      properties:
        destination_id:
          type: string
          example: "123e4567-e89b-12d3-a456-426614174000"
        destination_name:
          type: string
          example: "Marketing Team"
        success:
          type: boolean
          example: true
        error:
          type: string
          example: ""

    ExternalDestinationsResponse:
