      tags: [Internal API - Notifications]
      description: Get notifications within date range
      parameters:
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: List of notifications in date range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDateRangeResponse"

  # Destinations endpoints
  /internal/v1/destinations:
    get:
      summary: List destinations
      tags: [Internal API - Destinations]
      description: Get a list of destinations with pagination
      parameters:
