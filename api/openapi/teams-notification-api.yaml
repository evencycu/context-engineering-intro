components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
    SortBy:
      name: sort_by
      in: query
      schema:
        type: string
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "healthy"
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          example: "1.0.0"
    MetricsResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        system:
          $ref: "#/components/schemas/SystemMetrics"
        token_cache:
          $ref: "#/components/schemas/TokenCacheMetrics"
        actor_pool:
          $ref: "#/components/schemas/ActorPoolMetrics"
        database:
          $ref: "#/components/schemas/DatabaseMetrics"
        redis:
          $ref: "#/components/schemas/RedisMetrics"
    SystemMetrics:
      type: object
      properties:
        uptime:
          type: string
          description: "System uptime in seconds"
        memory_usage:
          type: number
          description: "Memory usage in bytes"
        cpu_usage:
          type: number
          description: "CPU usage percentage"
        goroutines:
          type: integer
          description: "Number of active goroutines"
    TokenCacheMetrics:
      type: object
      properties:
        cache_hits:
          type: integer
          description: "Number of cache hits"
        cache_misses:
          type: integer
          description: "Number of cache misses"
        active_tokens:
          type: integer
          description: "Number of active cached tokens"
        refresh_count:
          type: integer
          description: "Number of token refreshes"
        error_count:
          type: integer
          description: "Number of token errors"
    ActorPoolMetrics:
      type: object
      properties:
        active_actors:
          type: integer
          description: "Number of active actors"
        max_actors:
          type: integer
          description: "Maximum number of actors"
        queue_size:
          type: integer
          description: "Current queue size"
        processed_count:
          type: integer
          description: "Total processed notifications"
        error_count:
          type: integer
          description: "Total errors"
    DatabaseMetrics:
      type: object
      properties:
        open_connections:
          type: integer
          description: "Number of open database connections"
        idle_connections:
          type: integer
          description: "Number of idle connections"
        max_connections:
          type: integer
          description: "Maximum connections"
        query_count:
          type: integer
          description: "Total queries executed"
    RedisMetrics:
      type: object
      properties:
        connected:
          type: boolean
          description: "Redis connection status"
        memory_usage:
          type: string
          description: "Redis memory usage"
        key_count:
          type: integer
          description: "Number of keys in Redis"
        operations_per_second:
          type: number
          description: "Redis operations per second"
    ConfigResponse:
      type: object
      properties:
        server:
          $ref: "#/components/schemas/ServerConfig"
        database:
          $ref: "#/components/schemas/DatabaseConfig"
        redis:
          $ref: "#/components/schemas/RedisConfig"
        teams:
          $ref: "#/components/schemas/TeamsConfig"
        actor:
          $ref: "#/components/schemas/ActorConfig"
    ServerConfig:
      type: object
      properties:
        port:
          type: string
        environment:
          type: string
        read_timeout:
          type: string
        write_timeout:
          type: string
        rate_limit:
          type: integer
        burst:
          type: integer
    DatabaseConfig:
      type: object
      properties:
        max_open_conns:
          type: integer
        max_idle_conns:
          type: integer
        conn_max_lifetime:
          type: string
        conn_max_idle_time:
          type: string
    RedisConfig:
      type: object
      properties:
        pool_size:
          type: integer
        min_idle_conns:
          type: integer
        max_retries:
          type: integer
        timeout:
          type: string
    TeamsConfig:
      type: object
      properties:
        app_id:
          type: string
        tenant_id:
          type: string
        base_url:
          type: string
        timeout:
          type: string
    ActorConfig:
      type: object
      properties:
        max_actors:
          type: integer
        poll_interval:
          type: string
        retry_delay:
          type: string
        max_retries:
          type: integer
        circuit_breaker:
          $ref: "#/components/schemas/CircuitBreakerConfig"
    CircuitBreakerConfig:
      type: object
      properties:
        failure_threshold:
          type: integer
        recovery_timeout:
          type: string
        half_open_max_calls:
          type: integer
    ConfigValidationResponse:
      type: object
      properties:
        valid:
          type: boolean
          description: "Whether configuration is valid"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ConfigError"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ConfigWarning"
    ConfigError:
      type: object
      properties:
        field:
          type: string
          description: "Configuration field name"
        message:
          type: string
          description: "Error message"
        code:
          type: string
          description: "Error code"
    ConfigWarning:
      type: object
      properties:
        field:
          type: string
          description: "Configuration field name"
        message:
          type: string
          description: "Warning message"
        suggestion:
          type: string
