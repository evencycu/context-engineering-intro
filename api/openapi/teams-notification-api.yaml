          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
  /api/v1/projects/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Get project
      tags: [Projects]
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
    put:
      summary: Update project
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdateRequest"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
    delete:
      summary: Delete project
      tags: [Projects]
      responses:
        "204":
          description: Deleted
  /api/v1/projects/{id}/limits:
    patch:
      summary: Update project limits
      tags: [Projects]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                daily_limit:
                  type: integer
                monthly_limit:
                  type: integer
      responses:
        "200":
          description: Updated project
  /api/v1/projects/company/{companyId}:
    get:
      summary: List projects by company
      tags: [Projects]
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Project list
  /api/v1/projects/key/{keyName}:
    get:
      summary: Get project by notify key
      tags: [Projects]
      parameters:
        - name: keyName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
  /api/v1/bots/platform:
    get:
      summary: List platform bots
      tags: [Bots]
      responses:
        "200":
          description: Bot list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotListResponse"
    post:
      summary: Create platform bot
      tags: [Bots]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotCreateRequest"
      responses:
        "201":
          description: Created bot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotResponse"
  /api/v1/bots/platform/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Get platform bot
      tags: [Bots]
      responses:
        "200":
          description: Bot payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotResponse"
    put:
      summary: Update platform bot
      tags: [Bots]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotUpdateRequest"
      responses:
        "200":
          description: Updated bot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotResponse"
    delete:
      summary: Delete platform bot
      tags: [Bots]
      responses:
        "204":
          description: Deleted
  /api/v1/bots/platform/{id}/status:
    patch:
      summary: Update bot status
      tags: [Bots]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, inactive, suspended, maintenance]
      responses:
        "200":
          description: Updated bot
  /api/v1/bots/platform/{id}/capabilities:
    patch:
      summary: Update bot capabilities
      tags: [Bots]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Updated bot
  /api/v1/bots/platform/{id}/test:
    post:
      summary: Test bot connection
      tags: [Bots]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Test result
  /api/v1/bots/status/{status}:
    get:
      summary: List bots by status
      tags: [Bots]
      parameters:
        - name: status
          in: path
          required: true
          schema:
            type: string
            enum: [active, inactive, suspended, maintenance]
      responses:
        "200":
          description: Bot list
  /api/v1/destinations:
    get:
      summary: List destinations
      tags: [Destinations]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/Order"
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Destination collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedDestinations"
    post:
      summary: Create destination
      tags: [Destinations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationCreateRequest"
      responses:
        "201":
          description: Created destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationResponse"
  /api/v1/destinations/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Get destination
      tags: [Destinations]
      responses:
        "200":
          description: Destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationResponse"
    put:
      summary: Update destination
      tags: [Destinations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationUpdateRequest"
      responses:
        "200":
          description: Updated destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationResponse"
    delete:
      summary: Delete destination
      tags: [Destinations]
      responses:
        "204":
          description: Deleted
  /api/v1/destinations/{id}/targets:
    patch:
      summary: Update destination targets
      tags: [Destinations]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationTargetsRequest"
      responses:
        "200":
          description: Updated destination
  /api/v1/destinations/{id}/validate:
    post:
      summary: Validate destination targets
      tags: [Destinations]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Validation result
  /api/v1/destinations/project/{projectId}:
    get:
      summary: List destinations by project
      tags: [Destinations]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Destination list
  /api/v1/destinations/bot/{botId}:
    get:
      summary: List destinations by bot
      tags: [Destinations]
      parameters:
        - name: botId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Destination list
  /api/v1/destinations/search:
    get:
      summary: Search destinations
      tags: [Destinations]
      parameters:
        - name: target_type
          in: query
          schema:
            type: string
            enum: [person, channel, chatgroup]
        - name: target_id
          in: query
          schema:
            type: string
        - name: team_id
          in: query
          schema:
            type: string
        - name: channel_id
          in: query
          schema:
            type: string
        - name: user_id
          in: query
          schema:
            type: string
        - name: group_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Destination list
  /api/v1/notifications:
    get:
      summary: List notifications
      tags: [Notifications]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/Order"
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Notification list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedNotifications"
    post:
      summary: Send notification
      tags: [Notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSendRequest"
      responses:
        "202":
          description: Notification queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationEnqueueResponse"
  /api/v1/notifications/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Get notification
      tags: [Notifications]
      responses:
        "200":
          description: Notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResponse"
    delete:
      summary: Cancel notification
      tags: [Notifications]
      responses:
        "204":
          description: Cancelled
  /api/v1/notifications/{id}/retry:
    post:
      summary: Retry notification
      tags: [Notifications]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Retry accepted
  /api/v1/notifications/project/{projectId}:
    get:
      summary: List notifications by project
      tags: [Notifications]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Notification list
  /api/v1/notifications/sender/{senderId}:
    get:
      summary: List notifications by sender
      tags: [Notifications]
      parameters:
        - name: senderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Notification list
  /api/v1/notifications/status/{status}:
    get:
      summary: List notifications by status
      tags: [Notifications]
      parameters:
        - name: status
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Notification list
  /api/v1/notifications/date-range:
    get:
      summary: List notifications in date range
      tags: [Notifications]
      parameters:
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Notification list
  /api/v1/messages:
    post:
      summary: Bot Framework inbound message webhook
      tags: [Messages]
      responses:
        "200":
          description: Acknowledged
  /api/v1/messages/proactive/test:
    post:
      summary: Send proactive test message
      tags: [Messages]
      responses:
        "200":
          description: Test result
  /api/v1/provision:
    post:
      summary: Provision company/project/destination bundle
      description: |
        Create a complete notification setup including company, project, and destinations in one API call.
        This is the recommended way to set up new notification projects.
      tags: [Provision]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionCreateRequest"
            examples:
              basic:
                summary: Basic provision setup
                value:
                  company_id: "e4f160f4-4917-443d-86e9-29071967b768"
                  created_by: "11111111-1111-1111-1111-111111111111"
                  project_name: "My Notification Project"
                  project_description: "A project for sending notifications"
                  teams_tenant_id: "051cece0-e4dc-4aed-b471-bf29824e1ee6"
                  targets:
                    - type: "channel"
                      tenant_id: "051cece0-e4dc-4aed-b471-bf29824e1ee6"
                      conversation_id: "19:lg5lz80dPDcE8OtOolOHKsNZYIZI0IslJnnGDBV2H5A1@thread.tacv2"
                    - type: "personal"
                      tenant_id: "051cece0-e4dc-4aed-b471-bf29824e1ee6"
                      conversation_id: "a:12mhoHc_sRnffmXHY2H5EvR6MyvmkXiLI5pQ54k3o04gnTMip5k5XPJfrVzA0f8j0mt27QzqCW-Dn5EmRXZa14ckeenzWBArx_V0biX160RcnYMeg5rRzJ6isYrYx-TZR"
      responses:
        "201":
          description: Created bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisionCreateResponse"
              example:
                data:
                  notify_key: "5984f00fe2c5007ea0edb4e9b6269a4abf304e71070ee05ef05575bfacda5e38"
                  project:
                    id: "f6a110f8-27f9-477e-a651-6f8cdbc6dca5"
                    company_id: "e4f160f4-4917-443d-86e9-29071967b768"
                    notify_key: "5984f00fe2c5007ea0edb4e9b6269a4abf304e71070ee05ef05575bfacda5e38"
                    description: "A project for sending notifications"
                    status: "active"
                    daily_limit: 10000
                    monthly_limit: 300000
                    priority: "normal"
                  destination:
                    id: "cf867660-26ae-4437-828c-6fb2c2e3eb19"
                    project_id: "f6a110f8-27f9-477e-a651-6f8cdbc6dca5"
                    name: "My Notification Project-default"
                    description: "Auto-provisioned default destination"
                    teams_tenant_id: "051cece0-e4dc-4aed-b471-bf29824e1ee6"
                    targets:
                      - type: "channel"
                        conversation_id: "19:lg5lz80dPDcE8OtOolOHKsNZYIZI0IslJnnGDBV2H5A1@thread.tacv2"
                        tenant_id: "051cece0-e4dc-4aed-b471-bf29824e1ee6"
                      - type: "personal"
                        conversation_id: "a:12mhoHc_sRnffmXHY2H5EvR6MyvmkXiLI5pQ54k3o04gnTMip5k5XPJfrVzA0f8j0mt27QzqCW-Dn5EmRXZa14ckeenzWBArx_V0biX160RcnYMeg5rRzJ6isYrYx-TZR"
                        tenant_id: "051cece0-e4dc-4aed-b471-bf29824e1ee6"
                    status: "active"
                    validation_status: "pending"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/provision/{notify_key}:
    parameters:
      - name: notify_key
        in: path
        required: true
        schema:
          type: string
        description: The notify key of the provisioned project
    get:
      summary: Get provision bundle by notify key
      description: Retrieve the complete provision bundle including project and destinations
      tags: [Provision]
      responses:
        "200":
          description: Provision bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisionReadResponse"
