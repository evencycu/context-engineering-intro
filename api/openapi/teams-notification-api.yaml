        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"

  # Notifications endpoints
  /internal/v1/notifications:
    get:
      summary: List notifications
      tags: [Internal API - Notifications]
      description: Get a list of notifications with pagination
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
        - $ref: "#/components/parameters/SearchParam"
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, sent, failed, cancelled]
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"

    post:
      summary: Send notification
      tags: [Internal API - Notifications]
      description: Send a new notification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSendRequest"
      responses:
        "202":
          description: Notification queued successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSendResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"

  /internal/v1/notifications/{id}:
    get:
      summary: Get notification
