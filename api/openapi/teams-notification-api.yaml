      tags: [Internal API - Companies]
      description: Create a new company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyCreateRequest"
      responses:
        "201":
          description: Company created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"

  /internal/v1/companies/{id}:
    get:
      summary: Get company
      tags: [Internal API - Companies]
      description: Get company by ID
      parameters:
        - $ref: "#/components/parameters/CompanyIdParam"
      responses:
        "200":
          description: Company details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"

    put:
      summary: Update company
      tags: [Internal API - Companies]
      description: Update company by ID
      parameters:
        - $ref: "#/components/parameters/CompanyIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyUpdateRequest"
      responses:
        "200":
          description: Company updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"

    delete:
      summary: Delete company
      tags: [Internal API - Companies]
      description: Delete company by ID
      parameters:
        - $ref: "#/components/parameters/CompanyIdParam"
      responses:
        "204":
          description: Company deleted successfully
        "404":
          $ref: "#/components/responses/NotFoundError"

  /internal/v1/companies/{id}/status:
    patch:
      summary: Update company status
      tags: [Internal API - Companies]
      description: Update company status by ID
      parameters:
        - $ref: "#/components/parameters/CompanyIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyStatusUpdateRequest"
      responses:
        "200":
          description: Company status updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /internal/v1/companies/{id}/billing:
    patch:
      summary: Update company billing status
      tags: [Internal API - Companies]
      description: Update company billing status by ID
      parameters:
        - $ref: "#/components/parameters/CompanyIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectBillingUpdateRequest"
      responses:
        "200":
          description: Company billing status updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
