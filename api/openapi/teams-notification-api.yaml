    # External API Schemas
    ExternalNotificationRequest:
      type: object
      required:
        - notify_key
        - message
      properties:
        notify_key:
          type: string
          description: Project notification key
          example: "my-project-key"
          minLength: 3
          maxLength: 50
        message:
          type: string
          description: Message content to send
          example: "Hello from external API"
          minLength: 1
          maxLength: 4000
        message_type:
          type: string
          description: Type of message
          enum: [text, file, adaptive_card]
          default: text
          example: "text"
        priority:
          type: string
          description: Message priority
          enum: [low, normal, high, urgent]
          default: normal
          example: "normal"
        destinations:
          type: array
          description: List of destination IDs or 'all' for all destinations
          items:
            type: string
          example: ["all"]
        mentions:
          type: array
          description: List of users to mention
          items:
            type: string
          example: ["@user1", "@user2"]
        metadata:
          type: object
          description: Additional metadata
          example: { "source": "external", "version": "1.0" }

    ExternalNotificationResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            notification_id:
              type: string
              example: "123e4567-e89b-12d3-a456-426614174000"
            status:
              type: string
              enum: [sent, partial, failed]
              example: "sent"
            message:
              type: string
              example: "Notification processed successfully"
            project_id:
              type: string
              example: "123e4567-e89b-12d3-a456-426614174000"
            project_name:
              type: string
              example: "my-project-key"
            destinations_count:
              type: integer
              example: 3
            results:
              type: array
              items:
                $ref: "#/components/schemas/ExternalDestinationResult"
            estimated_delivery:
              type: string
              example: "5-10 minutes"
        error:
          type: string
          example: ""

    ExternalDestinationResult:
      type: object
      properties:
        destination_id:
          type: string
          example: "123e4567-e89b-12d3-a456-426614174000"
        destination_name:
          type: string
          example: "Marketing Team"
        success:
          type: boolean
          example: true
        error:
          type: string
          example: ""

    ExternalValidateResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        valid:
          type: boolean
          example: true
        error:
          type: string
          example: ""

    ExternalDestinationsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        destinations:
          type: array
          items:
            $ref: "#/components/schemas/ExternalDestinationInfo"
        error:
          type: string
          example: ""

    ExternalDestinationInfo:
      type: object
      properties:
        id:
          type: string
          example: "123e4567-e89b-12d3-a456-426614174000"
        name:
          type: string
          example: "Marketing Team"
        description:
          type: string
          example: "Marketing team notification destination"
        status:
          type: string
          example: "active"
        targets:
          type: array
          items:
            type: object
          example: [{ "type": "channel", "conversation_id": "19:abc123" }]

    ExternalHealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "healthy"
        service:
          type: string
          example: "external-api"
        timestamp:
          type: string
          example: "2025-09-26T03:51:33Z"

    # Error Response Schemas
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Invalid request format"
        code:
          type: string
          example: "VALIDATION_ERROR"
        details:
          type: object
          additionalProperties: true
          example: { "field": "notify_key", "message": "is required" }

    ValidationError:
      type: object
      properties:
        field:
          type: string
          example: "notify_key"
        message:
          type: string
          example: "is required"
        value:
          type: string
          example: ""

    # Common Response Wrappers
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        message:
          type: string
          example: "Operation completed successfully"

    # API Usage Examples
    APIUsageExample:
      type: object
      properties:
        curl_example:
          type: string
          example: 'curl -X POST http://localhost:8080/api/v1/external/notify -H ''Content-Type: application/json'' -d ''{"notify_key": "my-project", "message": "Hello World"}'''
        javascript_example:
          type: string
          example: "fetch('http://localhost:8080/api/v1/external/notify', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({notify_key: 'my-project', message: 'Hello World'}) })"

    get:
      summary: External API health check
      description: Health check for external API
      tags: [External API]
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalHealthResponse"
