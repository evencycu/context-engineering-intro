openapi: 3.0.3
info:
  title: Teams Notification API (Go implementation)
  version: 1.0.0
  description: |
    This specification documents the REST endpoints implemented in `cmd/server/main.go`.
    Includes all available routes including billing, file management, and batch notification features.

    ## Recent Updates (v1.0.0)
    - **Configuration Management**: Unified configuration system with environment variable validation
    - **Error Handling**: Standardized error responses with proper HTTP status codes
    - **Token Management**: Redis-backed token caching for improved performance
    - **Monitoring**: Enhanced health checks and system metrics
    - **Logging**: Structured logging with configurable levels and formats
servers:
  - url: http://localhost:8080
    description: Local development (default configuration)
paths:
  /health:
    get:
      summary: Service health check
      tags: [System]
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /metrics:
    get:
      summary: System metrics
      tags: [System]
      description: Returns system metrics including token cache statistics, actor pool status, and performance indicators
      responses:
        "200":
          description: System metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsResponse"
  /config:
    get:
      summary: Get system configuration
      tags: [System]
      description: Returns current system configuration (non-sensitive values only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Configuration information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /config/validate:
    post:
      summary: Validate configuration
      tags: [System]
      description: Validates current system configuration and environment variables
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Configuration validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigValidationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/companies:
    get:
      summary: List companies
      tags: [Companies]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/Order"
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Company collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCompanies"
    post:
      summary: Create company
      tags: [Companies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyCreateRequest"
      responses:
        "201":
          description: Created company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
  /api/v1/companies/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Get company
      tags: [Companies]
      responses:
        "200":
          description: Company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
    put:
      summary: Update company
      tags: [Companies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyUpdateRequest"
      responses:
        "200":
          description: Updated company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
    delete:
      summary: Delete company
      tags: [Companies]
      responses:
        "204":
          description: Deleted
  /api/v1/companies/{id}/status:
    patch:
      summary: Update company status
      tags: [Companies]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, inactive, suspended]
      responses:
        "200":
          description: Updated company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
  /api/v1/companies/{id}/billing:
    patch:
      summary: Update company billing enabled flag
      tags: [Companies]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: Updated company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
  /api/v1/users:
    get:
      summary: List users
      tags: [Users]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/Order"
        - name: role
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: User collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedUsers"
    post:
      summary: Create user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/v1/users/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Get user
      tags: [Users]
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
    put:
      summary: Update user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
    delete:
      summary: Delete user
      tags: [Users]
      responses:
        "204":
          description: Deleted
  /api/v1/users/{id}/password:
    patch:
      summary: Change user password
      tags: [Users]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password:
                  type: string
                new_password:
                  type: string
      responses:
        "200":
          description: Password updated
  /api/v1/users/{id}/api-key:
    patch:
      summary: Generate API key
      tags: [Users]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: API key payload
    delete:
      summary: Revoke API key
      tags: [Users]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Revoked
  /api/v1/users/company/{companyId}:
    get:
      summary: List users by company
      tags: [Users]
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User list
  /api/v1/users/role/{role}:
    get:
      summary: List users by role
      tags: [Users]
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User list
  /api/v1/projects:
    get:
      summary: List projects
      tags: [Projects]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: Project collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProjects"
    post:
