components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    LimitParam:
      name: limit
      in: query
      description: Number of items to return
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10

    OffsetParam:
      name: offset
      in: query
      description: Number of items to skip
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

    SearchParam:
      name: search
      in: query
      description: Search term
      required: false
      schema:
        type: string

    CompanyIdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Company ID

  responses:
    BadRequestError:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFoundError:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
        details:
          type: string
          description: Detailed error information
        timestamp:
          type: string
          format: date-time
          description: Error timestamp

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        timestamp:
          type: string
          format: date-time
        version:
          type: string
        uptime:
          type: string

    MetricsResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        system:
          $ref: "#/components/schemas/SystemMetrics"
        token_cache:
          $ref: "#/components/schemas/TokenCacheMetrics"
        actor_pool:
          $ref: "#/components/schemas/ActorPoolMetrics"

    SystemMetrics:
      type: object
      properties:
        memory_usage:
          type: number
        cpu_usage:
          type: number
        goroutines:
          type: integer
        uptime:
          type: string

    TokenCacheMetrics:
      type: object
      properties:
        hits:
          type: integer
        misses:
          type: integer
        hit_rate:
          type: number
        total_keys:
          type: integer

    ActorPoolMetrics:
      type: object
      properties:
        active_actors:
          type: integer
        idle_actors:
          type: integer
        total_actors:
          type: integer
        queue_size:
          type: integer

    # External API schemas
    ExternalNotifyRequest:
      type: object
      required:
        - notifyKey
        - message
      properties:
        notifyKey:
          type: string
          description: Project notify key
          example: "my-project-key"
        message:
          type: string
          description: Notification message
          example: "Hello from external API"
        messageType:
          type: string
          enum: [text, file, adaptive_card]
          default: text
          description: Type of message
        priority:
          type: string
          enum: [low, normal, high]
          default: normal
          description: Message priority
        targets:
          type: array
          items:
            type: string
          description: List of target emails, conversation IDs, or 'all'
          example: ["all"]
        mentions:
          type: array
          items:
            type: string
          description: List of user mentions
          example: ["@user1", "@user2"]
        metadata:
          type: object
          additionalProperties: true
          description: Additional metadata
          example: { "source": "external", "version": "1.0" }
        attachments:
          type: array
          description: Bot Framework attachments array. For Adaptive Card, set contentType to application/vnd.microsoft.card.adaptive and put card JSON in content.
          items:
            type: object
            properties:
              contentType:
                type: string
                example: application/vnd.microsoft.card.adaptive
              contentUrl:
                type: string
                nullable: true
              name:
                type: string
                nullable: true
              thumbnailUrl:
                type: string
                nullable: true
              content:
                type: object
                additionalProperties: true
          example:
            - contentType: application/vnd.microsoft.card.adaptive
              content:
                $schema: "http://adaptivecards.io/schemas/adaptive-card.json"
                type: AdaptiveCard
                version: "1.3"
                body:
                  - type: TextBlock
                    text: "Hello from Adaptive Card"
                    wrap: true

